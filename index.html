<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e8e6df;
        font-family: 'Helvetica Neue', Arial, sans-serif; user-select: none; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #vignette { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(120, 0, 0, 0.85) 100%); }
      #crosshair, #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
        transform: translate(-50%, -50%); }
      #crosshair { background:
        linear-gradient(#fff, #fff) 50% 0 / 2px 8px no-repeat, linear-gradient(#fff, #fff) 50% 100% / 2px 8px no-repeat,
        linear-gradient(#fff, #fff) 0 50% / 8px 2px no-repeat, linear-gradient(#fff, #fff) 100% 50% / 8px 2px no-repeat;
        opacity: 0.8; }
      #hitmarker { opacity: 0; transform: translate(-50%, -50%) rotate(45deg); background:
        linear-gradient(#fff, #fff) 50% 0 / 2px 9px no-repeat, linear-gradient(#fff, #fff) 50% 100% / 2px 9px no-repeat,
        linear-gradient(#fff, #fff) 0 50% / 9px 2px no-repeat, linear-gradient(#fff, #fff) 100% 50% / 9px 2px no-repeat; }
      #ammo { position: absolute; right: 40px; bottom: 32px; text-align: right; text-shadow: 0 1px 4px #000; }
      #ammo b { font-size: 44px; font-weight: 600; letter-spacing: 1px; }
      #ammo span { font-size: 20px; opacity: 0.7; }
      #ammo small { display: block; font-size: 12px; letter-spacing: 3px; opacity: 0.6; }
      #status { position: absolute; left: 40px; bottom: 32px; font-size: 13px; letter-spacing: 3px;
        text-shadow: 0 1px 4px #000; }
      #life { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
      #life small { font-size: 11px; opacity: 0.7; }
      #life b { width: 46px; font-size: 24px; letter-spacing: 1px; text-align: right; }
      #health { width: 240px; height: 14px; padding: 2px; border: 1px solid rgba(255, 255, 255, 0.55);
        background: rgba(0, 0, 0, 0.45); }
      #health i { display: block; height: 100%; width: 100%; background: #7fd26a; }
      #life.low b { color: #ff5a4a; }
      #life.low #health i { background: #e03a2f; }
      #radar { position: absolute; left: 32px; top: 28px; border-radius: 50%; background: rgba(10, 14, 12, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.3); }
      #score { position: absolute; right: 40px; top: 30px; font-size: 26px; font-weight: 600; letter-spacing: 2px;
        text-shadow: 0 1px 4px #000; }
      /* The sniper's scope picture: a clear circle with cross hairs in a black surround. */
      #scope { position: absolute; inset: 0; display: none;
        background: radial-gradient(circle at center, transparent 41vh, rgba(0, 0, 0, 0.5) 41.6vh, #000 43vh); }
      #scope::before, #scope::after { content: ''; position: absolute; background: #000; }
      #scope::before { left: 0; right: 0; top: 50%; height: 1px; }
      #scope::after { top: 0; bottom: 0; left: 50%; width: 1px; }
      #popup { position: absolute; left: 0; right: 0; top: 57%; text-align: center; font-size: 15px; letter-spacing: 3px;
        color: #f2d27a; text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity 0.25s; }
      #message { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font-size: 22px;
        letter-spacing: 6px; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity 0.4s; }
      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; background: rgba(8, 10, 12, 0.82); cursor: pointer; text-align: center; }
      #overlay h1 { margin: 0; font-size: 54px; letter-spacing: 16px; font-weight: 300; }
      #overlay p { margin: 0; font-size: 14px; letter-spacing: 2px; opacity: 0.75; line-height: 1.9; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="scope"></div>
      <div id="vignette"></div>
      <div id="crosshair"></div>
      <div id="hitmarker"></div>
      <div id="message"></div>
      <canvas id="radar" width="150" height="150"></canvas>
      <div id="score">0</div>
      <div id="popup"></div>
      <div id="status"><span id="wave"></span><div id="life"><small>HEALTH</small><div id="health"><i></i></div><b id="hp"></b></div></div>
      <div id="ammo"><small id="weapon"></small><b id="mag">30</b> <span id="reserve">/ 150</span><small id="grenades"></small></div>
    </div>
    <div id="overlay">
      <h1>FACTORY</h1>
      <p id="prompt">Loading…</p>
      <p>WASD move · SHIFT sprint · SPACE jump · MOUSE aim<br />LEFT CLICK fire · E aim down sights or scope · R reload · G frag grenade<br />1 2 3 or Q switch weapon · walk up to a weapon to pick it up</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
